<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.png"><title>BAG · Collection</title><link rel="stylesheet" href="/style.css"><body>
<header><strong class="brand"><img src="/logo.png" alt="" width="36" height="36"> BAG</strong><a class="install" href="/install.html">Add to Chrome</a><input id="search" type="search" placeholder="Search title or domain" aria-label="Search collection" hidden><button id="logout" hidden>Sign out</button></header>
<main><section id="auth" hidden><div class="poster" aria-hidden="true"><i></i><i></i><i></i></div><article><h1>Your BAG</h1><p>Save pages and links. Reopen them in the browser you already use.</p><form id="credentials"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button class="primary" id="submitAuth">Sign in</button></form><button id="switchMode">Create an account</button></article></section>
<section id="collection" hidden><small id="account"></small><h1>All items<span id="count"></span></h1><form id="add"><input id="url" type="url" placeholder="Paste a URL" aria-label="URL to save" required><select id="kind" aria-label="Item type"><option value="">Auto-detect type</option><!--BAG_KINDS--></select><label class="attach">Reference picture <input id="picture" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="primary">+ Save URL</button></form><p id="aiInfo"></p><div id="grid"></div><aside id="empty"></aside><button id="more" hidden>Load more</button></section><section id="startup"><h2>Opening your BAG</h2><p>If this screen stays open, restart the BAG server from the updated folder and reload this page.</p><a href="/">Reload BAG</a><noscript><p>Enable JavaScript for this address to use the dashboard.</p></noscript></section><p role="status" id="notice"></p></main><script type="module" src="/app.js"></script></body></html>
